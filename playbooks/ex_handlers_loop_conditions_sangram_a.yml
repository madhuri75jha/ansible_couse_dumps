---
- name: Example Playbook with Handlers and Loop
  hosts: all
  become: yes
  vars:
    packages_to_install:
      - name: apache2
        state: absent
      - name: php8.3-fpm
        state: absent

  tasks:
    - name: Install packages
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: "{{ item.state }}"
      loop: "{{ packages_to_install }}"
      when: ansible_facts['distribution'] == "Ubuntu" and ansible_facts['distribution_version']|int >= 22

